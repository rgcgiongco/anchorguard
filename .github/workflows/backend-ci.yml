name: Backend CI

on:
  push:
    branches: ["main", "master"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run backend tests
        run: |
          chmod +x ./gradlew || true
          ./gradlew test --stacktrace

      - name: Build backend Docker image
        run: docker build -t anchorguard-api:${{ github.sha }} -t anchorguard-api:ci .

      - name: Smoke-check Docker image metadata
        run: docker image inspect anchorguard-api:ci --format '{{.Id}} {{.Config.ExposedPorts}}'
