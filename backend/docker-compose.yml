services:
  db:
    image: postgres:16-alpine
    container_name: anchorguard-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anchorguard}
      POSTGRES_USER: ${POSTGRES_USER:-anchorguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anchorguard}
    volumes:
      - anchorguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anchorguard} -d ${POSTGRES_DB:-anchorguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anchorguard-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${ANCHORGUARD_DB_URL:-jdbc:postgresql://db:5432/${POSTGRES_DB:-anchorguard}}
      SPRING_DATASOURCE_USERNAME: ${ANCHORGUARD_DB_USER:-${POSTGRES_USER:-anchorguard}}
      SPRING_DATASOURCE_PASSWORD: ${ANCHORGUARD_DB_PASSWORD:-${POSTGRES_PASSWORD:-anchorguard}}
      ANCHORGUARD_JWT_SECRET: ${ANCHORGUARD_JWT_SECRET:?ANCHORGUARD_JWT_SECRET is required}
      ANCHORGUARD_CORS_ORIGINS: ${ANCHORGUARD_CORS_ORIGINS:-https://app.anchorguard.com}
      PORT: 8080
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: anchorguard-nginx
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    restart: unless-stopped

volumes:
  anchorguard_pgdata:
